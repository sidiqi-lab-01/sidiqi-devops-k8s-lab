services:

  db:
    image: postgres:17-alpine
    container_name: sidiqi-compose-db
    environment:
      POSTGRES_DB: ordersdb
      POSTGRES_USER: ordersuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - compose-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordersuser -d ordersdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  users:
    build:
      context: ./users
    image: sidiqi-compose-users:1.0
    container_name: sidiqi-compose-users
    networks:
      - compose-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    build:
      context: ./orders
    image: sidiqi-compose-orders:1.0
    container_name: sidiqi-compose-orders
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ordersdb
      DB_USER: ordersuser
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - compose-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    image: sidiqi-compose-api:1.0
    container_name: sidiqi-compose-api
    environment:
      USERS_SERVICE_URL: http://users:5001
      ORDERS_SERVICE_URL: http://orders:5002
    depends_on:
      users:
        condition: service_healthy
      orders:
        condition: service_healthy
    networks:
      - compose-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    image: sidiqi-compose-frontend:1.0
    container_name: sidiqi-compose-frontend
    ports:
      - "8180:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - compose-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  compose-network:
    name: sidiqi-compose-network
    driver: bridge

volumes:
  postgres-data:
    name: sidiqi-compose-postgres-data
